services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: teesheet-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set MSSQL_SA_PASSWORD}
      # sqlcmd reads this, so scripts never need the password on the command line
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - teesheet-data:/var/opt/mssql
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "localhost", "-U", "sa", "-Q", "SELECT 1", "-b"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  teesheet-data:
